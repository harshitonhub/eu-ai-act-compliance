<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% block title %}EU AI Act Compliance{% endblock %}</title>
  <script src="https://unpkg.com/htmx.org@2.0.3"></script>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 760px; margin: 2rem auto; padding: 0 1rem; color: #1a1a1a; }
    label { display: block; margin-top: 1rem; font-weight: 600; }
    input, textarea, select { width: 100%; padding: 0.5rem; margin-top: 0.25rem; box-sizing: border-box; font-family: inherit; }
    textarea { min-height: 5rem; }
    button { margin-top: 1.5rem; padding: 0.6rem 1.2rem; cursor: pointer; }
    table { border-collapse: collapse; width: 100%; margin-top: 0.5rem; }
    th, td { border: 1px solid #ccc; padding: 0.5rem; text-align: left; vertical-align: top; }
    .state-YES, .status-NON_COMPLIANT { color: #b00020; font-weight: 600; }
    .state-POSSIBLY, .status-PARTIALLY_COMPLIANT, .status-INSUFFICIENT_EVIDENCE { color: #a06800; font-weight: 600; }
    .state-NO, .status-COMPLIANT { color: #1a7a1a; }
    .state-INSUFFICIENT_INFORMATION, .state-NOT_APPLICABLE { color: #555; font-style: italic; }
    .flag { background: #fff3cd; border: 1px solid #ffe08a; padding: 0.5rem 0.75rem; margin: 0.4rem 0; border-radius: 4px; }
    .obligation-block { border: 1px solid #ddd; padding: 1rem; margin-top: 1rem; border-radius: 4px; }
    .citation { color: #555; font-size: 0.9em; }
    fieldset { border: 1px solid #ddd; margin-top: 1rem; }
  </style>
</head>
<body hx-boost="true">
  <h1><a href="/" style="text-decoration:none; color:inherit;">EU AI Act Compliance</a></h1>
  {% block content %}{% endblock %}
</body>
</html>
