[project]
name = "eu-ai-act-compliance"
version = "0.1.0"
description = "EU AI Act Compliance Platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    "anthropic>=0.40",
    "pypdf>=5.0",
    "python-docx>=1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "pip-audit>=2.10.1",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 130
# Alembic-generated migrations are templated by `alembic revision --autogenerate`, not
# hand-written -- linting them means either fighting Alembic's own template on every
# migration forever, or hand-editing generated files and risking drift from what
# actually ran against a real database. Reviewed for correctness, not style.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
# E/F: real errors (syntax, undefined names, unused imports). B: bugbear catches actual
# bug patterns (mutable defaults, bare except, this project's own zip()-without-strict
# finding). UP: pyupgrade. SIM: flake8-simplify. RUF: ruff's own additions (this is what
# caught an unused variable in a test). Deliberately excludes D (docstring formatting) --
# this codebase's rule is long explanatory docstrings that state the *why*, which is the
# opposite of what D's line-count/blank-line rules want.
select = ["E", "F", "B", "UP", "SIM", "RUF"]

# UP042 (str+Enum -> enum.StrEnum) is excluded deliberately, not an oversight: it's a
# real behavioral change, not a pure style fix. `class X(str, Enum)` and `enum.StrEnum`
# differ in what bare str(member) returns (the qualified name vs. the value), and every
# enum in this project is serialized somewhere -- Jinja templates, JSON responses,
# persisted JSON columns. Auditing every call site to confirm nothing relies on the old
# str() output is a real task with real risk, for a change with zero functional benefit.
ignore = ["UP042"]

[tool.ruff.lint.per-file-ignores]
# This file's job is emitting markdown table rows as f-string content -- each row must
# stay on one physical line or the generated table breaks. A trailing `# noqa` can't fix
# this the normal way: appended inside the triple-quoted string, it would print into the
# generated docs/eval-results.md instead of suppressing anything.
"scripts/generate_eval_report.py" = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# B008 ("no function calls in argument defaults") is a real check for the general case --
# a mutable/expensive default is evaluated once at def time and shared across every call.
# It's a false positive for FastAPI's `Depends(...)`: FastAPI's own signature inspection
# specifically requires Depends to be a default value to detect it, and re-resolves it
# per request rather than sharing one evaluation. This is ruff's own documented exception
# list for exactly this framework pattern, not a local workaround.
extend-immutable-calls = ["fastapi.Depends", "fastapi.params.Depends"]
